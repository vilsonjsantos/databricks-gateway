<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Databricks</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#667085; --line:#e4e7ec; --ok:#12805c; --warn:#b54708; --bad:#b42318; --acc:#2b59c3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1318; --card:#171c23; --ink:#e8ecf1; --mute:#93a0b1; --line:#262d37; --ok:#3ccf9b; --warn:#f0a35e; --bad:#ff7b72; --acc:#7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:16px; margin:0; }
  main { padding:16px; display:grid; gap:16px; max-width:1200px; margin:0 auto; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .k { color:var(--mute); font-size:12px; } .v { font-size:22px; font-weight:600; margin-top:2px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid currentColor; }
  .OK,.STATIC,.CLOSED { color:var(--ok); } .DEGRADED,.OPEN,.HALF_OPEN,.STARTING { color:var(--bad); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:500; font-size:12px; } .wrap { overflow-x:auto; }
  td.bad { color:var(--bad); } td.good { color:var(--ok); } td.num { font-variant-numeric:tabular-nums; }
  input { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:7px 12px; cursor:pointer; }
  #msg { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Gateway Databricks <span id="conn" class="pill">…</span></h1>
  <form id="f"><input id="key" type="password" placeholder="ADMIN_KEY" autocomplete="off"> <button>Entrar</button></form>
</header>
<main>
  <div id="msg"></div>
  <section class="grid">
    <div class="card"><div class="k">Autenticação Databricks</div><div class="v"><span id="auth" class="pill">—</span></div><div class="k" id="authd"></div></div>
    <div class="card"><div class="k">Circuito</div><div class="v"><span id="brk" class="pill">—</span></div></div>
    <div class="card"><div class="k">Chamadas (15 min)</div><div class="v" id="tot">—</div></div>
    <div class="card"><div class="k">Erros (15 min)</div><div class="v" id="err">—</div></div>
    <div class="card"><div class="k">No ar há</div><div class="v" id="up">—</div></div>
  </section>
  <section class="card"><div class="k">Por aplicação (15 min)</div>
    <div class="wrap"><table><thead><tr><th>App</th><th>Endpoint</th><th>Chamadas</th><th>Erros</th><th>p50 ms</th><th>p95 ms</th></tr></thead><tbody id="apps"></tbody></table></div></section>
  <section class="card"><div class="k">Últimos eventos (sem conteúdo de cliente)</div>
    <div class="wrap"><table><thead><tr><th>Hora</th><th>App</th><th>Usuário</th><th>Status</th><th>Tempo</th><th>Agente</th><th>Campos</th><th>Detalhe</th></tr></thead><tbody id="ev"></tbody></table></div></section>
</main>
<script>
  const $ = id => document.getElementById(id);
  let key = ''; try { key = sessionStorage.getItem('k') || ''; } catch (e) {}
  let last = 0, rows = [], timer;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pill = (el, v) => { el.textContent = v; el.className = 'pill ' + v; };
  const fmtUp = s => s >= 3600 ? Math.floor(s/3600) + ' h ' + Math.floor(s%3600/60) + ' min' : Math.floor(s/60) + ' min';

  async function api(path) {
    const r = await fetch(path, { headers: { 'X-Admin-Key': key } });
    if (!r.ok) throw new Error(r.status === 401 ? 'chave inválida' : 'erro ' + r.status);
    return r.json();
  }
  async function tick() {
    if (!key) return;
    try {
      const [st, ev] = await Promise.all([api('/admin/status'), api('/admin/events?limit=100&since_id=' + last)]);
      $('msg').textContent = ''; pill($('conn'), 'OK');
      pill($('auth'), st.auth.state); pill($('brk'), st.breaker);
      $('authd').textContent = st.auth.expires_at ? 'token até ' + new Date(st.auth.expires_at * 1000).toLocaleTimeString() + (st.auth.fails ? ' · falhas: ' + st.auth.fails : '') : (st.auth.last_error || st.config.auth_mode);
      $('tot').textContent = st.summary.total; $('err').textContent = st.summary.errors; $('up').textContent = fmtUp(st.summary.uptime_s);
      $('apps').innerHTML = st.apps.map(a => { const s = st.summary.per_app[a.app_id] || {total:0,errors:0,p50_ms:0,p95_ms:0};
        return `<tr><td>${esc(a.app_id)}${a.enabled ? '' : ' (off)'}</td><td>${esc(a.endpoint)}</td><td class="num">${s.total}</td><td class="num ${s.errors ? 'bad' : ''}">${s.errors}</td><td class="num">${s.p50_ms}</td><td class="num">${s.p95_ms}</td></tr>`; }).join('');
      if (ev.events.length) { last = ev.events[ev.events.length-1].id; rows = ev.events.slice().reverse().concat(rows).slice(0, 100); }
      $('ev').innerHTML = rows.map(e => `<tr><td>${new Date(e.ts*1000).toLocaleTimeString()}</td><td>${esc(e.app)}</td><td>${esc(e.user)}</td><td class="${e.status === 200 ? 'good' : 'bad'}">${esc(e.status)}</td><td class="num">${e.ms ?? ''}</td><td class="num">${e.llm_ms ?? ''}</td><td>${esc((e.fields||[]).join(', '))}</td><td>${esc(e.reason||'')}</td></tr>`).join('');
    } catch (e) { pill($('conn'), 'DEGRADED'); $('msg').textContent = String(e.message || e); }
  }
  $('f').onsubmit = ev => { ev.preventDefault(); key = $('key').value; try { sessionStorage.setItem('k', key); } catch (e) {} last = 0; rows = []; tick(); };
  tick(); timer = setInterval(tick, 2000);
</script>
</body>
</html>
